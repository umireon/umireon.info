    <use href="#hex" x="288" y="268" fill="#d6fbc7"/>
    <use href="#hex" x="420" y="344" fill="#ffffff"/>

    <use href="#hex" x="24"  y="420" fill="#d6fbc7"/>
    <use href="#hex" x="156" y="496" fill="#fbdfc6"/>
